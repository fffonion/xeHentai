[package]
name = "xehentai"
version = "2.23.0"
edition = "2024"
description = "xeHentai downloader, Rust + RustScript rewrite"
license = "GPL-3.0-or-later"
repository = "https://github.com/fffonion/xeHentai"

[[bin]]
name = "xeHentai"
path = "src/main.rs"

[dependencies]
pd-vm = { git = "https://github.com/rustscript-lang/rustscript.git", rev = "cdb0b798d631cd7ffab6dfed3fe4b69381ed3340", default-features = false, features = ["runtime"] }
regex = "1"
rust-i18n = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false }

[dev-dependencies]
tempfile = "3"
