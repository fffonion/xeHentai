[package]
name = "xeh-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "xeHentai RustScript embedding host"

[dependencies]
pd-vm = { git = "https://github.com/rustscript-lang/rustscript.git", rev = "99890b68119715df9ddd19f6a6362ff8d6258ffa", default-features = false, features = ["async", "runtime", "http-client"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "net", "io-util", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
bytes = "1"
http = "1"
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "net", "io-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rcgen = "0.13"
