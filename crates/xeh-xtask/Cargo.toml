[package]
name = "xeh-xtask"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "xeHentai compatibility oracle and verification commands"

[dependencies]
serde_json = "1"
xeh-host = { path = "../xeh-host" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "xeh-xtask"
path = "src/main.rs"

[dev-dependencies]
pd-vm = { git = "https://github.com/rustscript-lang/rustscript.git", rev = "cdb0b798d631cd7ffab6dfed3fe4b69381ed3340", default-features = false, features = ["async", "runtime", "http-client"] }
